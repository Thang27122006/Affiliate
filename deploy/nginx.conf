# Cấu hình Nginx Reverse Proxy cho Góc Phụ Kiện (Production)
# Đặt tại /etc/nginx/sites-available/gocphukien và tạo symlink sang sites-enabled/

upstream gocphukien_app {
    server 127.0.0.1:8000 fail_timeout=0;
    # Hoặc dùng unix socket nếu cấu hình gunicorn bind unix socket:
    # server unix:/run/gocphukien/gunicorn.sock fail_timeout=0;
}

# 1. Chuyển hướng toàn bộ HTTP sang HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name gocphukien.vn www.gocphukien.vn;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Server HTTPS chính thức
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name gocphukien.vn www.gocphukien.vn;

    # SSL Certificates (Let's Encrypt / Certbot)
    ssl_certificate /etc/letsencrypt/live/gocphukien.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gocphukien.vn/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Kích thước tối đa cho upload (khớp với giới hạn 5MB của Django)
    client_max_body_size 10M;

    # Gzip nén dữ liệu tĩnh
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;

    # Phục vụ tệp tĩnh (Static files) trực tiếp từ thư mục staticfiles đã collect
    location /static/ {
        alias /home/tmthang/Affiliate/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    # Phục vụ tệp media do người dùng tải lên (chỉ đọc trực tiếp, không cho phép thực thi script)
    location /media/ {
        alias /home/tmthang/Affiliate/media/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        # Bảo mật: Vô hiệu hóa việc thực thi bất kỳ script nào trong thư mục media
        location ~ \.(php|pl|py|jsp|asp|sh|cgi)$ {
            deny all;
        }
    }

    # Chuyển hướng các request động tới Gunicorn application server
    location / {
        proxy_pass http://gocphukien_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;

        # Timeouts
        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
    }
}
